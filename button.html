<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:active{
            background-color: black;
            color:white;

        }
        button:hover{
            background-color: blue;
            color:white;
        }
        a:link{
            text-decoration:none;
            color:black;
        }
        a:visited{
            color:green;
        }
        input:checked{
            box-shadow:1px 1px 5px black;
        }
        li:nth-child(2n){
            background-color:yellow;
        }
        li:not(:hover){
            color:pink;
        }

    </style>
</head>
<body>
    <button>Click Me</button>
    <a href="#">Link</a>
    <form>
        <input type="checkbox" checked>
    </form>
    <ul>
        <li type="square">1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
    </ul>
</body>
</html>
