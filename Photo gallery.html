<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="gallery">
        <img src="https://picsum.photos/300/200?random=1" alt="Photo 1">
        <img src="https://picsum.photos/300/200?random=2" alt="Photo 2">
        <img src="https://picsum.photos/300/200?random=3" alt="Photo 3">
        <img src="https://picsum.photos/300/200?random=4" alt="Photo 4">

        <img src="https://picsum.photos/300/200?random=5" alt="Photo 5">
        <img src="https://picsum.photos/300/200?random=6" alt="Photo 6">
        <img src="https://picsum.photos/300/200?random=7" alt="Photo 7">
        <img src="https://picsum.photos/300/200?random=8" alt="Photo 8">

        <img src="https://picsum.photos/300/200?random=9" alt="Photo 9">
        <img src="https://picsum.photos/300/200?random=10" alt="Photo 10">
        <img src="https://picsum.photos/300/200?random=11" alt="Photo 11">
        <img src="https://picsum.photos/300/200?random=12" alt="Photo 12">
    </div>

</body>
</html>
