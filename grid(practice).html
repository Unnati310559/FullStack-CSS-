<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            display:grid;
            height:500px;
            grid-template-columns: repeat(6,1fr);
            grid-template-rows:90px 190px 90px 100px;
            grid-template-areas:
            "box1 box1 box1 box1 box1 box1"
    "box2 box2 box3 box3 box4 box4"
    "box5 box5 box5 box5 box5 box5"
    "box6 box6 box6 box6 box6 box6";
    gap:10px;
     
        }
        .box{
            
            background:lightblue;
            padding:20px;
            font-size:25px;

        }
        .box1{
            grid-area:box1;
        }
        .box2{
            grid-area:box2;
        }
        .box3{
            grid-area:box3;
        }
        .box4{
            grid-area:box4;
        }
        .box5{
            grid-area:box5;
        }
        .box6{
            grid-area:box6;
        }
        @media (max-width: 768px) {
            #container {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: 100px 100px 100px 100px;
                grid-template-areas:
                    "box1 box1"
                    "box2 box3"
                    "box4 box5"
                    "box6 box6";
            }
        }

    </style>
</head>
<body>
    <div id="container">
        <div class="box box1">Box1</div>
        <div class="box box2">Box2</div>
        <div class="box box3">Box3</div>
        <div class="box box4">Box4</div>
        <div class="box box5">Box5</div>
        <div class="box box6">Box6</div>
    </div>
</body>
</html>
